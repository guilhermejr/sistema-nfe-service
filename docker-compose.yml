services:
  nfe-service:
    image: guilhermejr/sistema-nfe-service
    container_name: nfe-service
    restart: always
    env_file: /home/guilhermejr/secrets/nfe-service.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:9011:9011"

networks:
  default:
    external: true
    name: rede
